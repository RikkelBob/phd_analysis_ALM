[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ed_analysis"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "pandas",
    "pyyaml",
    "statsmodels",
    "openpyxl",
    "joblib",
    "mne",
    "pingouin",
    "matplotlib-venn",
    "seaborn",
    "tqdm",
    "zetapy",
    "dPCA",
    "numexpr",  # imported by dPCA.dPCA but not declared in dPCA's own dependencies
    "python-dotenv",
    "glasbey",
    "neo",
    "numba",
    "patsy",
    "rpy2",  # needs a system R install plus the R packages listed in README
]

[tool.setuptools.packages.find]
include = ["neural_analysis*"]

[tool.setuptools]
py-modules = ["config"]